<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Forensic Crime Files</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #080b12,
                    #111827,
                    #090d16
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            color: #ffffff;
        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-container {
            width: 100%;
            max-width: 430px;

            background: rgba(17, 24, 39, 0.96);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 18px;

            padding: 40px 32px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5);

            text-align: center;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #b91c1c;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            box-shadow:
                0 0 30px rgba(185, 28, 28, 0.35);
        }


        /* =========================================
           HEADING
        ========================================= */

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 32px;
        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #d1d5db;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border: 1px solid #374151;

            background: #0b1120;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #dc2626;

            box-shadow:
                0 0 0 3px rgba(220, 38, 38, 0.12);
        }

        input::placeholder {
            color: #6b7280;
        }


        /* =========================================
           PASSWORD WRAPPER
        ========================================= */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            background: none;
            border: none;

            color: #9ca3af;

            cursor: pointer;

            font-size: 13px;
        }

        .show-password:hover {
            color: white;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #b91c1c;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #dc2626;

            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;
        }

        .message.error {
            display: block;

            background: rgba(220, 38, 38, 0.12);

            border: 1px solid rgba(220, 38, 38, 0.3);

            color: #fca5a5;
        }

        .message.success {
            display: block;

            background: rgba(34, 197, 94, 0.12);

            border: 1px solid rgba(34, 197, 94, 0.3);

            color: #86efac;
        }


        /* =========================================
           BACK LINK
        ========================================= */

        .back-link {
            display: inline-block;

            margin-top: 25px;

            color: #9ca3af;

            text-decoration: none;

            font-size: 13px;
        }

        .back-link:hover {
            color: white;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-container {
                padding: 32px 22px;
            }

            h1 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">
            ⚖
        </div>


        <!-- TITLE -->

        <h1>
            Forensic Crime Files
        </h1>

        <p class="subtitle">
            Administrator Login
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="togglePassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- BACK -->

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Forensic Crime Files
        </a>


    </div>



    <script>

        // =========================================
        // BACKEND URL
        // =========================================

        const API_URL =
            "http://localhost:5000";


        // =========================================
        // ELEMENTS
        // =========================================

        const loginForm =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        const togglePassword =
            document.getElementById("togglePassword");


        // =========================================
        // SHOW / HIDE PASSWORD
        // =========================================

        togglePassword.addEventListener(
            "click",
            () => {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "Hide";

                }

                else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "Show";

                }

            }
        );


        // =========================================
        // DISPLAY MESSAGE
        // =========================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        // =========================================
        // LOGIN
        // =========================================

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;


                if (
                    !username ||
                    !password
                ) {

                    showMessage(
                        "Please enter username and password.",
                        "error"
                    );

                    return;

                }


                // Disable button

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/login`,
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Login failed"
                        );

                    }


                    // =================================
                    // SAVE JWT TOKEN
                    // =================================

                    localStorage.setItem(
                        "adminToken",
                        data.token
                    );


                    localStorage.setItem(
                        "adminUsername",
                        username
                    );


                    showMessage(
                        "Login successful. Opening dashboard...",
                        "success"
                    );


                    // =================================
                    // GO TO DASHBOARD
                    // =================================

                    setTimeout(
                        () => {

                            window.location.href =
                                "admin-dashboard.html";

                        },
                        700
                    );

                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to connect to server.",
                        "error"
                    );

                }

                finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>

</html>
